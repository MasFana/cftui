# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# goreleaser builds the release artifacts; the GitHub workflow in
# .github/workflows/release.yml invokes it on every v* tag.
version: 2

project_name: cftui

before:
  hooks:
    # The gate the workflow also runs. Failing here stops a broken release
    # before any artifact is produced.
    - go mod verify
    - go vet ./...
    - go test -count=1 ./...

builds:
  - id: cftui
    main: ./cmd/cftui
    binary: cftui
    # Static binaries: cftui uses no cgo, so disabling it keeps the Linux
    # builds portable across glibc/musl and makes cross-compiling trivial.
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: cftui
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - docs/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  name_template: "cftui {{.Version}}"
  footer: |
    ## Install

    Download the archive for your platform, verify it against
    `checksums.txt`, and put `cftui` on your `PATH`.

    cftui needs `cloudflared` installed and an origin certificate from
    `cloudflared tunnel login`; see the README for the full setup.
